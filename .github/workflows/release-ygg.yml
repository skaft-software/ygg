name: Ygg binary release

on:
  push:
    tags:
      - "ygg-binaries-v*"
      - "ygg-installer-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing canonical stable Ygg tag to package
        required: true
        type: string
      require_provider_acceptance:
        description: Require approved live-provider acceptance for this release
        required: false
        default: false
        type: boolean
      publish_npm:
        description: Publish npm packages after trusted-publisher and provenance verification setup
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "false"
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  resolve:
    name: Resolve canonical release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      workflow_commit: ${{ steps.release.outputs.workflow_commit }}
      core_workflow_commit: ${{ steps.release.outputs.core_workflow_commit }}
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: release
        name: Validate release tag and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_REQUIRE_PROVIDER_ACCEPTANCE: ${{ inputs.require_provider_acceptance }}
        run: |
          set -euo pipefail
          mode=binaries
          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            tag="$INPUT_RELEASE_TAG"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            case "$GITHUB_REF_NAME" in
              ygg-binaries-v*)
                mode=binaries
                tag=${GITHUB_REF_NAME#ygg-binaries-}
                ;;
              ygg-installer-v*)
                mode=installer
                tag=${GITHUB_REF_NAME#ygg-installer-}
                ;;
              *)
                echo "release tooling tags must start with ygg-binaries- or ygg-installer-" >&2
                exit 1
                ;;
            esac
          else
            echo "release_tag is required when this workflow is not running for a tag" >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid canonical stable release tag: $tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # Dispatching from a branch is allowed: the canonical tag is
            # resolved explicitly via INPUT_RELEASE_TAG above, and source
            # provenance is pinned to that tag's commit downstream.
            : # no additional constraint beyond release_tag being provided
          else
            case "$mode" in
              binaries) expected_workflow_tag="ygg-binaries-$tag" ;;
              installer) expected_workflow_tag="ygg-installer-$tag" ;;
              *)
                echo "invalid release mode: $mode" >&2
                exit 1
                ;;
            esac
            if [[ "$GITHUB_EVENT_NAME" != push \
              || "$GITHUB_REF_TYPE" != tag \
              || "$GITHUB_REF_NAME" != "$expected_workflow_tag" ]]; then
              echo "$mode release pushes must use $expected_workflow_tag" >&2
              exit 1
            fi
          fi

          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          source_commit=$(git rev-parse "$tag^{commit}")
          workflow_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          if [[ "$workflow_commit" != "$source_commit" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != push \
              || "$GITHUB_REF_TYPE" != tag \
              || "$GITHUB_REF_NAME" != "$expected_workflow_tag" ]]; then
              echo "workflow ref $workflow_commit does not match canonical release source $source_commit" >&2
              echo "tooling-only repairs must use the dedicated $expected_workflow_tag tag" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$source_commit" "$workflow_commit"; then
              echo "release tooling commit $workflow_commit does not descend from $source_commit" >&2
              exit 1
            fi
            unexpected_paths=$(git diff --name-only "$source_commit" "$workflow_commit" \
              | grep -Ev '^\.github/workflows/release-(ygg|serve)\.yml$' || true)
            if [[ -n "$unexpected_paths" ]]; then
              echo "tooling-only repair changes non-release-workflow paths:" >&2
              printf '%s\n' "$unexpected_paths" >&2
              exit 1
            fi
            if git diff --quiet "$source_commit" "$workflow_commit" -- .github/workflows/release-ygg.yml; then
              echo "tooling-only repair does not change the Ygg release workflow" >&2
              exit 1
            fi
            echo "using release tooling $workflow_commit with immutable source $source_commit"
            {
              echo "## Release tooling repair"
              echo
              echo "- Immutable source: \`$source_commit\`"
              echo "- Release tooling: \`$workflow_commit\`"
              echo "- Mode: \`$mode\`"
              echo "- Trigger: \`$GITHUB_REF_NAME\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          core_workflow_commit=$workflow_commit
          if [[ "$mode" == installer ]]; then
            core_workflow_tag="ygg-binaries-$tag"
            git fetch --force origin "refs/tags/$core_workflow_tag:refs/tags/$core_workflow_tag"
            core_workflow_commit=$(git rev-parse "$core_workflow_tag^{commit}")
            if ! git merge-base --is-ancestor "$source_commit" "$core_workflow_commit"; then
              echo "core release tooling $core_workflow_commit does not descend from $source_commit" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$core_workflow_commit" "$workflow_commit"; then
              echo "installer repair tooling $workflow_commit does not descend from core tooling $core_workflow_commit" >&2
              exit 1
            fi
            core_unexpected_paths=$(git diff --name-only "$source_commit" "$core_workflow_commit" \
              | grep -Ev '^\.github/workflows/release-(ygg|serve)\.yml$' || true)
            if [[ -n "$core_unexpected_paths" ]]; then
              echo "core release tooling changes non-release-workflow paths:" >&2
              printf '%s\n' "$core_unexpected_paths" >&2
              exit 1
            fi
          fi
          version=${tag#v}
          cargo_version=$(git show "$source_commit:Cargo.toml" \
            | awk -F '"' '/^version = / { print $2; exit }')
          if [[ "$cargo_version" != "$version" ]]; then
            echo "Cargo version $cargo_version does not match release tag $tag" >&2
            exit 1
          fi

          if ! release_state=$(gh release view "$tag" \
            --json tagName,isDraft,isPrerelease \
            --jq '[.tagName, .isDraft, .isPrerelease] | @tsv'); then
            echo "canonical release $tag does not exist" >&2
            exit 1
          fi
          IFS=$'\t' read -r release_tag draft prerelease <<< "$release_state"
          if [[ "$release_tag" != "$tag" ]]; then
            echo "resolved release tag $release_tag does not match $tag" >&2
            exit 1
          fi
          if [[ "$draft" != false ]]; then
            echo "canonical release $tag is still a draft" >&2
            exit 1
          fi
          if [[ "$prerelease" != false ]]; then
            echo "canonical release $tag is marked as a prerelease" >&2
            exit 1
          fi

          if [[ "$mode" == binaries ]]; then
            if [[ "${INPUT_REQUIRE_PROVIDER_ACCEPTANCE:-false}" == true ]]; then
              environment_name=stable-release-provider-acceptance
              workflow_id=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/provider-acceptance.yml" \
                --jq .id)
              evidence_run=$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs" \
                -f head_sha="$source_commit" \
                -f event=workflow_dispatch \
                -f status=success \
                -f per_page=100 \
                --jq '.workflow_runs | map(select(.event == "workflow_dispatch" and .conclusion == "success")) | sort_by(.run_started_at) | last | .id // empty')
              if [[ ! "$evidence_run" =~ ^[0-9]+$ ]]; then
                echo "no successful protected provider/audio acceptance run is bound to $source_commit" >&2
                exit 1
              fi
              evidence_sha=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$evidence_run" \
                --jq .head_sha)
              if [[ "$evidence_sha" != "$source_commit" ]]; then
                echo "provider acceptance evidence is not bound to $source_commit" >&2
                exit 1
              fi
              approval_count=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$evidence_run/approvals" \
                --jq '[.[] | select(.state == "approved") | .environments[]? | select(.name == "stable-release-provider-acceptance")] | length')
              if [[ ! "$approval_count" =~ ^[0-9]+$ || "$approval_count" -lt 1 ]]; then
                echo "provider acceptance run $evidence_run lacks a recorded $environment_name approval" >&2
                exit 1
              fi
              echo "using protected provider acceptance run $evidence_run for $source_commit"
            else
              echo "::warning title=Live-provider acceptance waived::Release packaging is proceeding without credentialed provider/audio acceptance for $source_commit"
              {
                echo "## Release acceptance"
                echo
                echo "- Candidate: \`$source_commit\`"
                echo "- Live provider/audio acceptance: **WAIVED**"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "## Installer portability repair"
              echo
              echo "- Existing signed binary assets remain immutable."
              echo "- Core signing workflow: \`$core_workflow_commit\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "source_commit=$source_commit"
            echo "workflow_commit=$workflow_commit"
            echo "core_workflow_commit=$core_workflow_commit"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

  security:
    name: Audit release dependencies
    needs: resolve
    if: needs.resolve.outputs.mode == 'binaries'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: apps/web/.node-version
      # Release audits and artifacts intentionally use clean dependency/build
      # state. Pull-request or branch caches must never enter a privileged
      # publish path.
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: cargo audit
      - run: cargo audit --file extensions/ygg-serve/Cargo.lock
      - run: cargo deny check
      - run: cargo deny --manifest-path extensions/ygg-serve/Cargo.toml check
      - run: npm ci
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve, security]
    if: needs.resolve.outputs.mode == 'binaries'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out immutable release source and tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}
          path: source
          fetch-depth: 0
      # Keep release optimization independent from the workspace's 1.86 MSRV.
      # This immutable action revision installs Rust 1.97.1.
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
        with:
          targets: ${{ matrix.target }}
      - name: Verify release Rust compiler
        run: test "$(rustc --version | awk '{print $2}')" = "1.97.1"
      # Build release artifacts from clean runner state. CI caches remain useful
      # for unprivileged validation jobs, never for publishable binaries.
      - name: Build optimized Ygg binaries
        working-directory: source
        run: cargo build --release --locked --target "${{ matrix.target }}" -p ygg-coding-agent --bins
      - name: Verify standalone binaries
        shell: bash
        run: |
          set -euo pipefail
          binary="source/target/${{ matrix.target }}/release/ygg"
          host_binary="source/target/${{ matrix.target }}/release/ygg-host"
          test -x "$binary"
          test -x "$host_binary"
          test "$("$binary" --version)" = "ygg ${{ needs.resolve.outputs.version }}"
          test_home="$RUNNER_TEMP/ygg-binary-smoke-home"
          mkdir -p "$test_home"
          HOME="$test_home" "$binary" --help >/dev/null
          HOME="$test_home" "$binary" extension --help >/dev/null
          printf '%s\n' '{"protocol_version":1,"request_id":"release-smoke","command":"hello"}' \
            | HOME="$test_home" "$host_binary" \
            | grep -F '"type":"hello"' >/dev/null
      - name: Package target-specific archive
        shell: bash
        run: |
          set -euo pipefail
          source/scripts/package-ygg-release.sh \
            "${{ matrix.target }}" \
            "$RUNNER_TEMP/ygg-release" \
            "${{ needs.resolve.outputs.tag }}" \
            source
          source/scripts/package-ygg-release.sh \
            "${{ matrix.target }}" \
            "$RUNNER_TEMP/ygg-release-reproducibility-check" \
            "${{ needs.resolve.outputs.tag }}" \
            source
          archive="$RUNNER_TEMP/ygg-release/ygg-${{ needs.resolve.outputs.version }}-${{ matrix.target }}.tar.gz"
          repeated_archive="$RUNNER_TEMP/ygg-release-reproducibility-check/ygg-${{ needs.resolve.outputs.version }}-${{ matrix.target }}.tar.gz"
          test -f "$archive"
          cmp "$archive" "$repeated_archive"
          tar -tzf "$archive"
          package="ygg-${{ needs.resolve.outputs.version }}-${{ matrix.target }}"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/$package/ygg-host"
          if tar -tzf "$archive" | grep -E '(^|/)(\.DS_Store|__pycache__|research|plans|reports|superpowers)(/|$)'; then
            echo "release archive contains a local-only asset" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ygg-core-${{ matrix.target }}
          path: ${{ runner.temp }}/ygg-release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Sign and attach Ygg binaries
    needs: [resolve, build]
    if: needs.resolve.outputs.mode == 'binaries'
    runs-on: ubuntu-24.04
    # Human approval is required only when the immutable artifacts are ready to
    # receive write/OIDC privileges, not while unprivileged validation runs.
    environment: stable-release-publish
    outputs:
      release_tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Check out immutable release source and tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ygg-core-*
          path: release-assets
          merge-multiple: true
      - name: Add source-bound binary installer
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          python3 - "$SOURCE_COMMIT" "$WORKFLOW_COMMIT" scripts/install.sh release-assets/install-ygg.sh <<'PY'
          import pathlib
          import re
          import sys

          source_commit, workflow_commit, source_path, destination_path = sys.argv[1:5]
          for name, commit in (
              ("release source", source_commit),
              ("release workflow", workflow_commit),
          ):
              if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
                  raise SystemExit(f"{name} commit is malformed")
          source = pathlib.Path(source_path).read_text(encoding="utf-8")
          placeholder = 'release_source_commit="__YGG_RELEASE_SOURCE_COMMIT__"'
          if source.count(placeholder) != 1:
              raise SystemExit("installer source-commit placeholder is missing or ambiguous")
          generated = source.replace(
              placeholder,
              (
                  f'release_source_commit="{source_commit}"\n'
                  f'release_workflow_commit="{workflow_commit}"'
              ),
          )
          signature_commit_argument = '        "$release_source_commit" \\\n'
          if generated.count(signature_commit_argument) != 1:
              raise SystemExit("installer signature-commit argument is missing or ambiguous")
          generated = generated.replace(
              signature_commit_argument,
              '        "$release_workflow_commit" \\\n',
          )
          pathlib.Path(destination_path).write_text(generated, encoding="utf-8")
          PY
          chmod 0755 release-assets/install-ygg.sh
          if grep -F '__YGG_RELEASE_SOURCE_COMMIT__' release-assets/install-ygg.sh; then
            echo "generated installer still contains its source-commit placeholder" >&2
            exit 1
          fi
          grep -F "release_source_commit=\"$SOURCE_COMMIT\"" release-assets/install-ygg.sh
          grep -F "release_workflow_commit=\"$WORKFLOW_COMMIT\"" release-assets/install-ygg.sh
          release-assets/install-ygg.sh --help | grep -F "Install Ygg ${{ needs.resolve.outputs.version }}."
          ls -la release-assets/
          ls -la release-assets/
          test "$(find release-assets -maxdepth 1 -name 'ygg-*.tar.gz' | wc -l | tr -d ' ')" = 3
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Create checksums and keyless signatures
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./*.tar.gz ./install-ygg.sh | sort -k2 > YGG_SHA256SUMS
          for artifact in ./*.tar.gz ./install-ygg.sh; do
            cosign sign-blob \
              --yes \
              --bundle "${artifact}.sigstore.json" \
              "$artifact"
          done
          cosign sign-blob \
            --yes \
            --bundle YGG_SHA256SUMS.sigstore.json \
            YGG_SHA256SUMS
          cat YGG_SHA256SUMS
      - name: Verify checksums and signatures
        shell: bash
        env:
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          COSIGN_IDENTITY: https://github.com/${{ github.workflow_ref }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check YGG_SHA256SUMS
          verify=(
            --certificate-identity "$COSIGN_IDENTITY"
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER"
            --certificate-github-workflow-name "Ygg binary release"
            --certificate-github-workflow-repository "$WORKFLOW_REPOSITORY"
            --certificate-github-workflow-sha "$WORKFLOW_COMMIT"
          )
          for artifact in ./*.tar.gz ./install-ygg.sh; do
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              "${verify[@]}" \
              "$artifact"
          done
          cosign verify-blob \
            --bundle YGG_SHA256SUMS.sigstore.json \
            "${verify[@]}" \
            YGG_SHA256SUMS
      - name: Create and verify immutable release metadata
        shell: bash
        env:
          EXPECTED_OIDC_ISSUER: https://token.actions.githubusercontent.com
          COSIGN_IDENTITY: https://github.com/${{ github.workflow_ref }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          python3 scripts/generate-ygg-release-metadata.py \
            "$VERSION" \
            "$RELEASE_TAG" \
            "$SOURCE_COMMIT" \
            "$WORKFLOW_COMMIT" \
            "$WORKFLOW_REF" \
            "$WORKFLOW_REPOSITORY" \
            release-assets/YGG_SHA256SUMS \
            release-assets/YGG_RELEASE_METADATA.json
          cosign sign-blob \
            --yes \
            --bundle release-assets/YGG_RELEASE_METADATA.json.sigstore.json \
            release-assets/YGG_RELEASE_METADATA.json
          cosign verify-blob \
            --bundle release-assets/YGG_RELEASE_METADATA.json.sigstore.json \
            --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_OIDC_ISSUER" \
            --certificate-github-workflow-name "Ygg binary release" \
            --certificate-github-workflow-repository "$WORKFLOW_REPOSITORY" \
            --certificate-github-workflow-sha "$WORKFLOW_COMMIT" \
            release-assets/YGG_RELEASE_METADATA.json
      - name: Attach assets to canonical release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          WORKFLOW_TAG: ygg-binaries-${{ needs.resolve.outputs.tag }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          verify_release_refs() {
            phase=$1
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$SOURCE_COMMIT" ]]; then
              echo "canonical tag moved while release artifacts were $phase" >&2
              exit 1
            fi
            git fetch --force origin "refs/tags/$WORKFLOW_TAG:refs/tags/$WORKFLOW_TAG"
            if [[ "$(git rev-parse "$WORKFLOW_TAG^{commit}")" != "$WORKFLOW_COMMIT" ]]; then
              echo "release workflow tag moved while release artifacts were $phase" >&2
              exit 1
            fi
          }
          verify_release_refs building
          if ! release_state=$(gh release view "$RELEASE_TAG" \
            --json tagName,isDraft,isPrerelease \
            --jq '[.tagName, .isDraft, .isPrerelease] | @tsv'); then
            echo "canonical release $RELEASE_TAG no longer exists" >&2
            exit 1
          fi
          IFS=$'\t' read -r release_tag draft prerelease <<< "$release_state"
          if [[ "$release_tag" != "$RELEASE_TAG" || "$draft" != false || "$prerelease" != false ]]; then
            echo "canonical release $RELEASE_TAG is no longer a published stable release" >&2
            exit 1
          fi
          existing_digests=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | [.name, (.digest // "")] | @tsv')
          uploads=()
          for asset in release-assets/*; do
            name=${asset##*/}
            if existing_digest=$(awk -F '\t' -v wanted="$name" '$1 == wanted { print $2; found=1 } END { exit found ? 0 : 1 }' <<< "$existing_digests"); then
              if [[ -z "$existing_digest" ]]; then
                echo "existing release asset has no immutable digest: $name" >&2
                exit 1
              fi
              local_digest=$(sha256sum "$asset" | awk '{print $1}')
              if [[ "$existing_digest" != "sha256:$local_digest" ]]; then
                echo "immutable release asset differs from the existing asset: $name" >&2
                exit 1
              fi
              echo "verified existing immutable release asset: $name"
            else
              uploads+=("$asset")
            fi
          done
          if ((${#uploads[@]})); then
            gh release upload "$RELEASE_TAG" "${uploads[@]}"
          else
            echo "all release assets already match the immutable candidate"
          fi
          verify_release_refs publishing

  verify-published:
    name: Verify binary install on ${{ matrix.target }}
    needs: [resolve, publish]
    if: needs.resolve.outputs.mode == 'binaries'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Download and run published installer without Cargo
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/install-ygg.sh"
          installer_url="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/install-ygg.sh"
          for attempt in 1 2 3 4 5; do
            if curl \
              --proto '=https' \
              --proto-redir '=https' \
              --tlsv1.2 \
              --location \
              --fail \
              --silent \
              --show-error \
              --output "$installer" \
              "$installer_url"; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "published installer is not readable" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

          test_home="$RUNNER_TEMP/ygg-binary-install-home"
          install_directory="$test_home/bin"
          fake_tools="$RUNNER_TEMP/no-cargo"
          mkdir -p "$test_home" "$fake_tools"
          cat > "$fake_tools/cargo" <<'EOF'
          #!/bin/sh
          echo "binary installer unexpectedly invoked Cargo" >&2
          exit 99
          EOF
          chmod 0755 "$fake_tools/cargo"

          installed=false
          for attempt in 1 2 3 4 5; do
            rm -f "$install_directory/ygg" "$install_directory/ygg-host"
            if HOME="$test_home" \
              YGG_INSTALL_DIR="$install_directory" \
              YGG_NO_MODIFY_PATH=1 \
              PATH="$fake_tools:$PATH" \
              sh "$installer"; then
              installed=true
              break
            fi
            echo "published binary assets are not readable yet (attempt $attempt)" >&2
            sleep $((attempt * 2))
          done
          if [[ "$installed" != true ]]; then
            echo "could not install Ygg from published binary assets" >&2
            exit 1
          fi

          binary="$install_directory/ygg"
          host_binary="$install_directory/ygg-host"
          test -x "$binary"
          test -x "$host_binary"
          test "$(HOME="$test_home" "$binary" --version)" = "ygg $VERSION"
          HOME="$test_home" "$binary" --help >/dev/null
          printf '%s\n' '{"protocol_version":1,"request_id":"published-smoke","command":"hello"}' \
            | HOME="$test_home" "$host_binary" \
            | grep -F '"type":"hello"' >/dev/null
          HOME="$test_home" "$binary" extension install ygg-serve
          HOME="$test_home" "$binary" extension list | grep -F "ygg-serve"
          HOME="$test_home" "$binary" extension remove ygg-serve
          test ! -e "$test_home/.ygg/extensions/ygg-serve"

  package-npm:
    name: Package verified npm artifacts
    needs: [resolve, verify-published]
    if: needs.resolve.outputs.mode == 'binaries' && inputs.publish_npm == true
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out immutable release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/apps/web/.node-version
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Download and verify the settled immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --dir release-assets \
            --clobber \
            --pattern 'install-ygg.sh' \
            --pattern 'install-ygg.sh.sigstore.json' \
            --pattern 'ygg-*.tar.gz' \
            --pattern 'ygg-*.tar.gz.sigstore.json' \
            --pattern 'YGG_SHA256SUMS' \
            --pattern 'YGG_SHA256SUMS.sigstore.json' \
            --pattern 'YGG_RELEASE_METADATA.json' \
            --pattern 'YGG_RELEASE_METADATA.json.sigstore.json'
          cd release-assets
          sha256sum --check YGG_SHA256SUMS
          verify=(
            --certificate-identity "https://github.com/$WORKFLOW_REF"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-name "Ygg binary release"
            --certificate-github-workflow-repository "$WORKFLOW_REPOSITORY"
            --certificate-github-workflow-sha "$WORKFLOW_COMMIT"
          )
          cosign verify-blob \
            --bundle YGG_SHA256SUMS.sigstore.json \
            "${verify[@]}" \
            YGG_SHA256SUMS
          cosign verify-blob \
            --bundle YGG_RELEASE_METADATA.json.sigstore.json \
            "${verify[@]}" \
            YGG_RELEASE_METADATA.json
          for artifact in ./*.tar.gz ./install-ygg.sh; do
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              "${verify[@]}" \
              "$artifact"
          done
          python3 ../source/scripts/generate-ygg-release-metadata.py \
            "$VERSION" \
            "$RELEASE_TAG" \
            "$SOURCE_COMMIT" \
            "$WORKFLOW_COMMIT" \
            "$WORKFLOW_REF" \
            "$WORKFLOW_REPOSITORY" \
            YGG_SHA256SUMS \
            "$RUNNER_TEMP/recomputed-release-metadata.json"
          cmp YGG_RELEASE_METADATA.json "$RUNNER_TEMP/recomputed-release-metadata.json"
      - name: Build and validate npm tarballs from the verified assets
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          source_date_epoch=$(git -C source show -s --format=%ct "$SOURCE_COMMIT")
          SOURCE_DATE_EPOCH="$source_date_epoch" source/scripts/package-ygg-npm.sh \
            "$VERSION" \
            "$PWD/release-assets" \
            "$RUNNER_TEMP/npm-assets" \
            "$PWD/release-assets/YGG_SHA256SUMS"
          python3 source/scripts/create-ygg-npm-manifest.py \
            "$VERSION" \
            "$TAG" \
            "$SOURCE_COMMIT" \
            "$WORKFLOW_COMMIT" \
            "$PWD/release-assets/YGG_RELEASE_METADATA.json" \
            "$RUNNER_TEMP/npm-assets" \
            "$RUNNER_TEMP/npm-assets/YGG_NPM_MANIFEST.json" \
            "$RUNNER_TEMP/npm-assets/YGG_NPM_SHA256SUMS"
          (cd "$RUNNER_TEMP/npm-assets" && sha256sum --check YGG_NPM_SHA256SUMS)
          python3 source/scripts/verify-ygg-npm.py \
            "$VERSION" \
            "$RUNNER_TEMP/npm-assets" \
            --json > "$RUNNER_TEMP/npm-verification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ygg-npm
          path: ${{ runner.temp }}/npm-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish npm packages with trusted publishing
    needs: [resolve, package-npm]
    if: needs.resolve.outputs.mode == 'binaries'
    runs-on: ubuntu-24.04
    environment: stable-release-publish
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Check out immutable release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/apps/web/.node-version
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Install the pinned trusted-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_cli_integrity='sha512-Iy5vXZ55m8tIaSCz6bqQf9+W5XbPfoyURsgWLjOkFglqHTep6RDZqRj2sfYGeRyZvGu2HuJWm0lux0rxPQ29lQ=='
          npm_cli_directory=$(mktemp -d "$RUNNER_TEMP/npm-cli.XXXXXX")
          trap 'rm -rf "$npm_cli_directory"' EXIT
          npm pack npm@11.5.1 --registry "$NPM_REGISTRY" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --pack-destination "$npm_cli_directory" >/dev/null
          npm_cli_archive="$npm_cli_directory/npm-11.5.1.tgz"
          test -f "$npm_cli_archive"
          actual_integrity=$(node -e 'const fs=require("fs"); const crypto=require("crypto"); process.stdout.write("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));' "$npm_cli_archive")
          test "$actual_integrity" = "$npm_cli_integrity"
          npm install --global \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "$npm_cli_archive"
          test "$(npm --version)" = "11.5.1"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ygg-npm
          path: npm-assets
      - name: Revalidate package evidence before OIDC publication
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          (cd npm-assets && sha256sum --check YGG_NPM_SHA256SUMS)
          python3 source/scripts/verify-ygg-npm.py "$VERSION" npm-assets --json > "$RUNNER_TEMP/npm-verification.json"
          python3 - "$VERSION" "$TAG" "$SOURCE_COMMIT" "$WORKFLOW_COMMIT" npm-assets/YGG_NPM_MANIFEST.json <<'PY'
          import json
          import re
          import sys
          version, tag, source_commit, workflow_commit, path = sys.argv[1:]
          manifest = json.load(open(path, encoding="utf-8"))
          expected = {
              "schema": "ygg.npm.release.v1",
              "repository": "skaft-software/ygg",
              "tag": tag,
              "version": version,
              "source_commit": source_commit,
              "workflow_commit": workflow_commit,
          }
          if any(manifest.get(key) != value for key, value in expected.items()):
              raise SystemExit("npm manifest identity does not match the immutable candidate")
          if re.fullmatch(r"[0-9a-f]{40}", source_commit) is None or re.fullmatch(r"[0-9a-f]{40}", workflow_commit) is None:
              raise SystemExit("npm manifest commit identity is malformed")
          if len(manifest.get("packages", [])) != 4:
              raise SystemExit("npm manifest does not describe all four packages")
          PY
      - name: Preflight immutable npm versions
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          for descriptor in \
            '@skaft-software/ygg|ygg-'"$VERSION"'.tgz' \
            '@skaft-software/ygg-darwin-arm64|ygg-darwin-arm64-'"$VERSION"'.tgz' \
            '@skaft-software/ygg-darwin-x64|ygg-darwin-x64-'"$VERSION"'.tgz' \
            '@skaft-software/ygg-linux-x64-gnu|ygg-linux-x64-gnu-'"$VERSION"'.tgz'; do
            IFS='|' read -r package artifact <<< "$descriptor"
            expected=$(node -e 'const fs=require("fs"); const crypto=require("crypto"); process.stdout.write("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));' "npm-assets/$artifact")
            if existing=$(npm view "$package@$VERSION" dist.integrity --json --registry "$NPM_REGISTRY" 2>/dev/null); then
              existing=${existing#\"}
              existing=${existing%\"}
              if [[ "$existing" != "$expected" ]]; then
                echo "immutable npm version exists with a different integrity: $package@$VERSION" >&2
                exit 1
              fi
              echo "verified existing immutable package $package@$VERSION"
            else
              echo "package $package@$VERSION is not published yet"
            fi
          done
      - name: Publish platform packages before the launcher with npm provenance
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          for descriptor in \
            '@skaft-software/ygg-darwin-arm64|ygg-darwin-arm64-'"$VERSION"'.tgz' \
            '@skaft-software/ygg-darwin-x64|ygg-darwin-x64-'"$VERSION"'.tgz' \
            '@skaft-software/ygg-linux-x64-gnu|ygg-linux-x64-gnu-'"$VERSION"'.tgz' \
            '@skaft-software/ygg|ygg-'"$VERSION"'.tgz'; do
            IFS='|' read -r package artifact <<< "$descriptor"
            if npm view "$package@$VERSION" version --registry "$NPM_REGISTRY" >/dev/null 2>&1; then
              echo "skipping already verified immutable package $package@$VERSION"
              continue
            fi
            npm publish "npm-assets/$artifact" --registry "$NPM_REGISTRY" \
              --access public \
              --provenance \
              --ignore-scripts \
              --no-audit \
              --no-fund
          done
      - name: Verify registry integrity and provenance
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for descriptor in \
            '@skaft-software/ygg-darwin-arm64|ygg-darwin-arm64-'"$VERSION"'.tgz' \
            '@skaft-software/ygg-darwin-x64|ygg-darwin-x64-'"$VERSION"'.tgz' \
            '@skaft-software/ygg-linux-x64-gnu|ygg-linux-x64-gnu-'"$VERSION"'.tgz' \
            '@skaft-software/ygg|ygg-'"$VERSION"'.tgz'; do
            IFS='|' read -r package artifact <<< "$descriptor"
            expected=$(node -e 'const fs=require("fs"); const crypto=require("crypto"); process.stdout.write("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));' "npm-assets/$artifact")
            registry_metadata="$RUNNER_TEMP/npm-registry.json"
            npm view "$package@$VERSION" --json --registry "$NPM_REGISTRY" > "$registry_metadata"
          attestation_url=$(python3 - "$registry_metadata" "$package" "$VERSION" <<'PY'
          import json
          import sys
          from urllib.parse import unquote, urlsplit
          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          package, version = sys.argv[2:]
          url = metadata.get("dist", {}).get("attestations", {}).get("url")
          parsed = urlsplit(url) if isinstance(url, str) else None
          if (
              parsed is None
              or parsed.scheme != "https"
              or parsed.netloc != "registry.npmjs.org"
              or parsed.query
              or parsed.fragment
              or unquote(parsed.path) != f"/-/npm/v1/attestations/{package}@{version}"
          ):
              raise SystemExit("registry returned a non-canonical npm attestation URL")
          print(url)
          PY
          )
            attestations="$RUNNER_TEMP/npm-attestations.json"
            curl \
              --proto '=https' \
              --proto-redir '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              --max-filesize 1048576 \
              --output "$attestations" \
              "$attestation_url"
            python3 source/scripts/verify-ygg-npm-provenance.py \
              "$registry_metadata" \
              "$attestations" \
              npm-assets/YGG_NPM_MANIFEST.json \
              "$package" \
              "$VERSION" \
              "$expected" \
              "https://github.com/$WORKFLOW_REPOSITORY" \
              '.github/workflows/release-ygg.yml' \
              "$SOURCE_COMMIT" \
              "$WORKFLOW_COMMIT"
          done
      - name: Sign and attach npm evidence to the canonical release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          verify=(
            --certificate-identity "https://github.com/${{ github.workflow_ref }}"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-name "Ygg binary release"
            --certificate-github-workflow-repository "$WORKFLOW_REPOSITORY"
            --certificate-github-workflow-sha "$WORKFLOW_COMMIT"
          )
          for artifact in npm-assets/*.tgz; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
          done
          cosign sign-blob --yes --bundle npm-assets/YGG_NPM_SHA256SUMS.sigstore.json npm-assets/YGG_NPM_SHA256SUMS
          cosign sign-blob --yes --bundle npm-assets/YGG_NPM_MANIFEST.json.sigstore.json npm-assets/YGG_NPM_MANIFEST.json
          cosign verify-blob --bundle npm-assets/YGG_NPM_SHA256SUMS.sigstore.json "${verify[@]}" npm-assets/YGG_NPM_SHA256SUMS
          cosign verify-blob --bundle npm-assets/YGG_NPM_MANIFEST.json.sigstore.json "${verify[@]}" npm-assets/YGG_NPM_MANIFEST.json
          existing_digests=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | [.name, (.digest // "")] | @tsv')
          uploads=()
          for asset in npm-assets/*.tgz npm-assets/*.sigstore.json npm-assets/YGG_NPM_SHA256SUMS npm-assets/YGG_NPM_MANIFEST.json; do
            name=${asset##*/}
            if existing_digest=$(awk -F '\t' -v wanted="$name" '$1 == wanted { print $2; found=1 } END { exit found ? 0 : 1 }' <<< "$existing_digests"); then
              if [[ -z "$existing_digest" ]]; then
                echo "existing release asset has no immutable digest: $name" >&2
                exit 1
              fi
              local_digest=$(sha256sum "$asset" | awk '{print $1}')
              if [[ "$existing_digest" != "sha256:$local_digest" ]]; then
                echo "immutable release asset differs from the existing asset: $name" >&2
                exit 1
              fi
              echo "verified existing immutable release asset: $name"
            else
              uploads+=("$asset")
            fi
          done
          if ((${#uploads[@]})); then
            gh release upload "$RELEASE_TAG" "${uploads[@]}"
          else
            echo "all npm evidence assets already match the immutable candidate"
          fi

