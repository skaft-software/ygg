          done

  smoke-npm-published:
    name: Smoke published npm package on ${{ matrix.target }}
    needs: [resolve, verify-npm-published]
    if: needs.resolve.outputs.mode == 'binaries'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: GNU/Linux x64
          - os: macos-15-intel
            target: macOS Intel
          - os: macos-15
            target: macOS Apple silicon
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Install the exact public launcher without lifecycle scripts
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/ygg-npm-prefix"
          mkdir -p "$prefix"
          npm install --global --prefix "$prefix" --registry "$NPM_REGISTRY" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "@skaft-software/ygg@$VERSION"
          PATH="$prefix/bin:$PATH"
          export PATH
          test "$(ygg --version)" = "ygg $VERSION"
          ygg --help >/dev/null
          printf '%s\n' '{"protocol_version":1,"request_id":"npm-published-smoke","command":"hello"}' \
            | ygg-host \
            | grep -F '"type":"hello"' >/dev/null
          npm uninstall --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund @skaft-software/ygg
          test ! -e "$prefix/bin/ygg"

  publish-installer-repair:
    name: Sign and attach portable Ygg installer
    needs: resolve
    if: needs.resolve.outputs.mode == 'installer'
    runs-on: ubuntu-24.04
    environment: stable-release-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}
          fetch-depth: 0
      - name: Generate version-pinned portable installer
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          CORE_WORKFLOW_COMMIT: ${{ needs.resolve.outputs.core_workflow_commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release-assets
          installer="release-assets/install-ygg-$RELEASE_TAG.sh"
          python3 - \
            "$SOURCE_COMMIT" \
            "$CORE_WORKFLOW_COMMIT" \
            scripts/install.sh \
            "$installer" <<'PY'
          import pathlib
          import re
          import sys

          source_commit, core_workflow_commit, source_path, destination_path = sys.argv[1:5]
          for name, commit in (
              ("release source", source_commit),
              ("core release workflow", core_workflow_commit),
          ):
              if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
                  raise SystemExit(f"{name} commit is malformed")

          generated = pathlib.Path(source_path).read_text(encoding="utf-8")
          placeholder = 'release_source_commit="__YGG_RELEASE_SOURCE_COMMIT__"'
          if generated.count(placeholder) != 1:
              raise SystemExit("installer source-commit placeholder is missing or ambiguous")
          generated = generated.replace(
              placeholder,
              (
                  f'release_source_commit="{source_commit}"\n'
                  f'release_workflow_commit="{core_workflow_commit}"'
              ),
          )

          signature_commit_argument = '        "$release_source_commit" \\\n'
          if generated.count(signature_commit_argument) != 1:
              raise SystemExit("installer signature-commit argument is missing or ambiguous")
          generated = generated.replace(
              signature_commit_argument,
              '        "$release_workflow_commit" \\\n',
          )

          portable = '''    bundle_reference = bundle_path
              if not os.path.exists(manifest_reference):
                  raise RuntimeError("descriptor-relative verification is unavailable")'''
          if generated.count(portable) != 1:
              raise SystemExit("installer does not contain the portable bundle-reference block")

          pathlib.Path(destination_path).write_text(generated, encoding="utf-8")
          PY
          chmod 0755 "$installer"
          if grep -F '__YGG_RELEASE_SOURCE_COMMIT__' "$installer"; then
            echo "generated installer still contains its source-commit placeholder" >&2
            exit 1
          fi
          grep -F "release_source_commit=\"$SOURCE_COMMIT\"" "$installer"
          grep -F "release_workflow_commit=\"$CORE_WORKFLOW_COMMIT\"" "$installer"
          grep -F 'bundle_reference = bundle_path' "$installer"
          if grep -F 'bundle_reference = f"/dev/fd/{bundle}"' "$installer"; then
            echo "generated installer still passes the bundle through a shared Darwin descriptor" >&2
            exit 1
          fi
          "$installer" --help | grep -F "Install Ygg ${{ needs.resolve.outputs.version }}."
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Verify existing core release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          CORE_WORKFLOW_COMMIT: ${{ needs.resolve.outputs.core_workflow_commit }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir upstream-assets
          gh release download "$RELEASE_TAG" \
            --dir upstream-assets \
            --pattern YGG_SHA256SUMS \
            --pattern YGG_SHA256SUMS.sigstore.json
          core_identity="https://github.com/$WORKFLOW_REPOSITORY/.github/workflows/release-ygg.yml@refs/tags/ygg-binaries-$RELEASE_TAG"
          cosign verify-blob \
            --bundle upstream-assets/YGG_SHA256SUMS.sigstore.json \
            --certificate-identity "$core_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-name "Ygg binary release" \
            --certificate-github-workflow-repository "$WORKFLOW_REPOSITORY" \
            --certificate-github-workflow-sha "$CORE_WORKFLOW_COMMIT" \
            upstream-assets/YGG_SHA256SUMS
          gh release view "$RELEASE_TAG" --json assets > upstream-assets/release.json
          python3 - \
            upstream-assets/YGG_SHA256SUMS \
            upstream-assets/release.json \
            "${{ needs.resolve.outputs.version }}" <<'PY'
          import json
          import pathlib
          import re
          import sys

          manifest_path, release_path, version = sys.argv[1:4]
          expected = {
              "install-ygg.sh",
              f"ygg-{version}-aarch64-apple-darwin.tar.gz",
              f"ygg-{version}-x86_64-apple-darwin.tar.gz",
              f"ygg-{version}-x86_64-unknown-linux-gnu.tar.gz",
          }
          pattern = re.compile(r"^([0-9a-f]{64})  \./([A-Za-z0-9_.-]+)$")
          entries = {}
          for line in pathlib.Path(manifest_path).read_text(encoding="ascii").splitlines():
              match = pattern.fullmatch(line)
              if match is None or match.group(2) in entries:
                  raise SystemExit("core checksum manifest is malformed")
              entries[match.group(2)] = match.group(1)
          if set(entries) != expected:
              raise SystemExit("core checksum manifest has an unexpected asset set")

          release = json.loads(pathlib.Path(release_path).read_text(encoding="utf-8"))
          assets = {asset["name"]: asset for asset in release["assets"]}
          required = expected | {"YGG_SHA256SUMS", "YGG_SHA256SUMS.sigstore.json"}
          missing = required - set(assets)
          if missing:
              raise SystemExit(f"core release assets are missing: {sorted(missing)}")
          for name, digest in entries.items():
              if assets[name].get("digest") != f"sha256:{digest}":
                  raise SystemExit(f"GitHub digest does not match signed manifest for {name}")
          PY
      - name: Sign and verify portable installer
        shell: bash
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.workflow_ref }}
          WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          installer="release-assets/install-ygg-$RELEASE_TAG.sh"
          cosign sign-blob \
            --yes \
            --bundle "$installer.sigstore.json" \
            "$installer"
          cosign verify-blob \
            --bundle "$installer.sigstore.json" \
            --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-name "Ygg binary release" \
            --certificate-github-workflow-repository "$WORKFLOW_REPOSITORY" \
            --certificate-github-workflow-sha "$WORKFLOW_COMMIT" \
            "$installer"
          sha256sum "$installer" "$installer.sigstore.json"
      - name: Attach portable installer to canonical release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          CORE_WORKFLOW_TAG: ygg-binaries-${{ needs.resolve.outputs.tag }}
          CORE_WORKFLOW_COMMIT: ${{ needs.resolve.outputs.core_workflow_commit }}
          INSTALLER_WORKFLOW_TAG: ${{ github.ref_name }}
          INSTALLER_WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          verify_release_refs() {
            phase=$1
            for ref_spec in \
              "$RELEASE_TAG:$SOURCE_COMMIT" \
              "$CORE_WORKFLOW_TAG:$CORE_WORKFLOW_COMMIT" \
              "$INSTALLER_WORKFLOW_TAG:$INSTALLER_WORKFLOW_COMMIT"; do
              tag_name=${ref_spec%%:*}
              expected_commit=${ref_spec#*:}
              git fetch --force origin "refs/tags/$tag_name:refs/tags/$tag_name"
              if [[ "$(git rev-parse "$tag_name^{commit}")" != "$expected_commit" ]]; then
                echo "release tag $tag_name moved while installer assets were $phase" >&2
                exit 1
              fi
            done
          }
          verify_release_refs prepared
          release_state=$(gh release view "$RELEASE_TAG" \
            --json tagName,isDraft,isPrerelease \
            --jq '[.tagName, .isDraft, .isPrerelease] | @tsv')
          IFS=$'\t' read -r release_tag draft prerelease <<< "$release_state"
          if [[ "$release_tag" != "$RELEASE_TAG" || "$draft" != false || "$prerelease" != false ]]; then
            echo "canonical release $RELEASE_TAG is not a published stable release" >&2
            exit 1
          fi
          existing_digests=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | [.name, (.digest // "")] | @tsv')
          uploads=()
          for asset in release-assets/*; do
            name=${asset##*/}
            if existing_digest=$(awk -F '\t' -v wanted="$name" '$1 == wanted { print $2; found=1 } END { exit found ? 0 : 1 }' <<< "$existing_digests"); then
              if [[ -z "$existing_digest" ]]; then
                echo "existing release asset has no immutable digest: $name" >&2
                exit 1
              fi
              local_digest=$(sha256sum "$asset" | awk '{print $1}')
              if [[ "$existing_digest" != "sha256:$local_digest" ]]; then
                echo "immutable release asset differs from the existing asset: $name" >&2
                exit 1
              fi
              echo "verified existing immutable release asset: $name"
            else
              uploads+=("$asset")
            fi
          done
          if ((${#uploads[@]})); then
            gh release upload "$RELEASE_TAG" "${uploads[@]}"
          else
            echo "all release assets already match the immutable candidate"
          fi
          verify_release_refs published

  verify-installer-repair:
    name: Verify portable installer on ${{ matrix.target }}
    needs: [resolve, publish-installer-repair]
    if: needs.resolve.outputs.mode == 'installer'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Download and run published portable installer without Cargo
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/install-ygg-$RELEASE_TAG.sh"
          installer_url="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/install-ygg-$RELEASE_TAG.sh"
          for attempt in 1 2 3 4 5; do
            if curl \
              --proto '=https' \
              --proto-redir '=https' \
              --tlsv1.2 \
              --location \
              --fail \
              --silent \
              --show-error \
              --output "$installer" \
              "$installer_url"; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "published portable installer is not readable" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

          test_home="$RUNNER_TEMP/ygg-portable-install-home"
          install_directory="$test_home/bin"
          fake_tools="$RUNNER_TEMP/no-cargo"
          mkdir -p "$test_home" "$fake_tools"
          cat > "$fake_tools/cargo" <<'EOF'
          #!/bin/sh
          echo "binary installer unexpectedly invoked Cargo" >&2
          exit 99
          EOF
          chmod 0755 "$fake_tools/cargo"

          HOME="$test_home" \
            YGG_INSTALL_DIR="$install_directory" \
            YGG_NO_MODIFY_PATH=1 \
            PATH="$fake_tools:$PATH" \
            sh "$installer"

          binary="$install_directory/ygg"
          host_binary="$install_directory/ygg-host"
          test -x "$binary"
          test -x "$host_binary"
          test "$(HOME="$test_home" "$binary" --version)" = "ygg $VERSION"
          HOME="$test_home" "$binary" --help >/dev/null
          printf '%s\n' '{"protocol_version":1,"request_id":"portable-installer-smoke","command":"hello"}' \
            | HOME="$test_home" "$host_binary" \
            | grep -F "\"sdk_version\":\"$VERSION\"" >/dev/null
          HOME="$test_home" "$binary" extension install ygg-serve
          HOME="$test_home" "$binary" extension list | grep -F "ygg-serve"
          HOME="$test_home" "$binary" extension remove ygg-serve
          test ! -e "$test_home/.ygg/extensions/ygg-serve"
