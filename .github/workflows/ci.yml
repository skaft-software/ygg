name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "false"

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: cargo audit
      - run: cargo audit --file extensions/ygg-serve/Cargo.lock
      - run: cargo deny check
      - run: cargo deny --manifest-path extensions/ygg-serve/Cargo.toml check

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Test binary release tooling
        run: |
          sh -n scripts/install.sh
          bash -n \
            scripts/build-ygg-image.sh \
            scripts/package-ygg-extension-release.sh \
            scripts/package-ygg-release.sh \
            scripts/package-ygg-serve-release.sh \
            scripts/test-binary-installer.sh \
            scripts/package-ygg-npm.sh \
            scripts/test-ygg-npm.sh \
            scripts/test-ygg-npm-install.sh \
            scripts/test-homebrew-formula.sh
          python3 -m py_compile scripts/provider-acceptance.py scripts/generate-ygg-release-metadata.py scripts/create-ygg-npm-manifest.py scripts/verify-ygg-npm.py scripts/verify-ygg-npm-provenance.py scripts/generate-homebrew-formula.py
          version="v$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          while IFS= read -r extension; do
            [[ -n "$extension" ]] || continue
            scripts/package-ygg-extension-release.sh \
              "$extension" "$RUNNER_TEMP/extension-bundles" "$version"
            scripts/package-ygg-extension-release.sh \
              "$extension" "$RUNNER_TEMP/extension-bundles-repeat" "$version"
            cmp \
              "$RUNNER_TEMP/extension-bundles/$extension-${version#v}.tar.gz" \
              "$RUNNER_TEMP/extension-bundles-repeat/$extension-${version#v}.tar.gz"
          done < <(grep -Ev '^[[:space:]]*(#|$)' extensions/release-catalog.txt)
          scripts/test-binary-installer.sh
          scripts/build-ygg-image.sh --context "$RUNNER_TEMP/ygg-container-context"
          test "$(cat "$RUNNER_TEMP/ygg-container-context/.ygg-container-source")" = "$(git rev-parse HEAD)"
          test ! -e "$RUNNER_TEMP/ygg-container-context/.git"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --doc --locked
      - run: cargo fmt --manifest-path extensions/ygg-serve/Cargo.toml -- --check
      - run: cargo clippy --manifest-path extensions/ygg-serve/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path extensions/ygg-serve/Cargo.toml --locked
      # Cargo 1.90 stabilized packaging interdependent workspace crates. Keep
      # the dedicated compilation check on the 1.86 MSRV in the job below; use
      # 1.90 only to assemble the publishable crates together. The serve feature depends on the
      # publish-excluded optional extension.
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
        with:
          toolchain: 1.90.0
      - run: cargo +1.90.0 package --workspace --exclude ygg-coding-agent --locked --no-verify

  first-party-extension-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test the shared Python SDK and every official extension adapter
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 --version
          PYTHONPATH=sdk/python python3 -m unittest discover -s sdk/python/tests
          while IFS= read -r extension; do
            [[ -n "$extension" ]] || continue
            root="extensions/$extension"
            test -d "$root/tests"
            if [[ -f "$root/tests/__init__.py" ]]; then
              (cd "$root" && python3 -m unittest discover -s tests -t .)
            else
              (cd "$root" && python3 -m unittest discover -s tests)
            fi
          done < <(grep -Ev '^[[:space:]]*(#|$)' extensions/release-catalog.txt)

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo check --workspace --all-targets --no-default-features --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - run: cargo check --workspace --all-targets --all-features --locked

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:fonts
      - run: npm run build
      - run: npm run check:external
      - run: npm run bundle:check
      - run: cargo build -p ygg-coding-agent --bin ygg --features serve --locked
        working-directory: ${{ github.workspace }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:live

  smoke-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - run: cargo install --debug --locked --path crates/ygg-coding-agent --bins --features serve --root "$RUNNER_TEMP/ygg-install"
      - run: "$RUNNER_TEMP/ygg-install/bin/ygg --version"
      - run: "$RUNNER_TEMP/ygg-install/bin/ygg --help"
      - name: Smoke-test installed native host
        run: |
          test -x "$RUNNER_TEMP/ygg-install/bin/ygg-host"
          printf '%s\n' '{"protocol_version":1,"request_id":"ci-smoke","command":"hello"}' \
            | "$RUNNER_TEMP/ygg-install/bin/ygg-host" \
            | grep -F '"type":"hello"' >/dev/null
      - run: scripts/smoke-ygg-serve-installed.sh "$RUNNER_TEMP/ygg-install/bin/ygg"
