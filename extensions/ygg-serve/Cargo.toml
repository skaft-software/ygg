[package]
name = "ygg-serve-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "Optional first-party session host backend for Ygg graphical clients."
publish = false

# Keep the experimental first-party package independently buildable without
# adding it to Ygg's shipping workspace or changing the root lockfile.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio", "ws"] }
bytes = "1"
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
