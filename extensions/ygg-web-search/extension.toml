name = "ygg-web-search"
version = "0.3.0"
api_version = "0.2"
requires_ygg = "=0.7.0-dev"
description = "Selectable Brave Search or SearXNG web search with bounded public-page retrieval and stable citations"

[entrypoint]
command = "extension.py"

[capabilities]
# The runtime manages ~/.config/ygg/ygg-web-search.json and an owner-private
# Brave API key under ~/.ygg/credentials; both fixed user paths are outside the
# active workspace.
filesystem = "unrestricted"
process = false
network = true

[contributes]
tools = ["web_search", "web_fetch", "web_find"]
commands = ["web-search"]
ui = ["status"]
presentation = true
