name = "ygg-web-search"
version = "0.1.0"
api_version = "0.2"
requires_ygg = "=0.5.0"
description = "Bounded SearXNG-backed web search and public-page retrieval with stable citations"

[entrypoint]
command = "extension.py"

[capabilities]
# The runtime reads only ~/.config/ygg/ygg-web-search.json, but that fixed user
# path lies outside the active workspace and must therefore be declared honestly.
filesystem = "unrestricted"
process = false
network = true

[contributes]
tools = ["web_search", "web_open", "web_find"]
ui = ["status"]
presentation = true
