name = "ygg-hermes-memory"
version = "0.1.0"
api_version = "0.2"
requires_ygg = "=0.5.0"
description = "Pinned Hermes Agent MemoryProvider compatibility bridge"

[entrypoint]
command = "ygg-hermes-memory"

[capabilities]
filesystem = "unrestricted"
process = true
network = true

[contributes]
commands = ["memory"]
hooks = ["before_prompt", "after_response", "after_tool_call"]
ui = ["status"]
context = true
presentation = true
