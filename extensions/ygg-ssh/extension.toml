name = "ygg-ssh"
version = "0.2.0"
api_version = "0.2"
requires_ygg = "=0.6.0-dev"
description = "Verified SSH portal guidance for explicit authenticated OpenSSH aliases"

[entrypoint]
command = "ygg-ssh"

[capabilities]
filesystem = "unrestricted"
process = true
network = true
environment = ["SSH_AUTH_SOCK"]

[contributes]
commands = ["ssh"]
ui = ["status"]
context = true
