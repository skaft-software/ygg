[package]
name = "ygg-companion-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "Bounded host/native framing for the experimental Ygg companion."
publish = false

[workspace]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["io-util"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[lints.rust]
missing_docs = "warn"
