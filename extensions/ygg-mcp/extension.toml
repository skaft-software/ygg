name = "ygg-mcp"
version = "0.1.0"
api_version = "0.2"
requires_ygg = "=0.6.7"
description = "Resident bridge for explicitly configured stdio and Streamable HTTP MCP tool servers"

[entrypoint]
command = "ygg-mcp"

[capabilities]
filesystem = "unrestricted"
process = true
network = true

[contributes]
commands = ["mcp"]
ui = ["status"]
presentation = true
