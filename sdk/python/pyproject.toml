[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ygg-extension-sdk"
version = "0.1.0"
description = "Dependency-free Python SDK for Ygg executable extensions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Skaft Software"}]
keywords = ["ygg", "extension", "json-rpc"]

[tool.setuptools.packages.find]
where = ["."]
