[workspace]
resolver = "2"
members = [
    "crates/sexy-tui-rs",
    "crates/ygg-ai",
    "crates/ygg-agent",
    "crates/ygg-coding-agent",
    "crates/ygg-migrate-types",
]
exclude = ["extensions/ygg-serve"]

[workspace.package]
version = "0.6.7"
edition = "2021"
authors = ["Skaft Software"]
repository = "https://github.com/skaft-software/ygg"
homepage = "https://skaft.org/ygg"
rust-version = "1.86"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# Money must be exact integers; no floating-point arithmetic in pricing.
# (Enforced per-module where relevant; kept off the workspace default to avoid
# false positives on legitimate f32 sampling knobs like `temperature`.)

[profile.dev]
# Keep Cargo's parallel dev-codegen shape explicit. A single codegen unit made
# every check and test build serialize LLVM work, which is a poor trade for an
# interactive project whose normal workflow repeatedly rebuilds a few crates.
codegen-units = 16

[profile.release]
# The interactive binary is latency- and footprint-sensitive. Thin LTO keeps
# most of the cross-crate wins without the much longer full-LTO link, while a
# single codegen unit gives LLVM a complete view of each crate.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.ci-test]
# CI does not benefit from keeping incremental state between clean runners.
# Limited debug info retains useful backtraces without test-profile-sized DWARF.
inherits = "test"
debug = "limited"
incremental = false

[profile.profiling]
# Keep release-like optimization while retaining symbols and full debug data for
# profilers. `off`, unlike `false`, also disables local ThinLTO.
inherits = "release"
debug = "full"
lto = "off"
strip = "none"

# Keep the audited lopdf 0.42.0 parser compatible with the Rust 1.86 MSRV.
# Upstream 0.42.0 declares 1.85 but uses let-chain syntax stabilized later;
# this local patch only rewrites that syntax and does not change parser logic.
[patch.crates-io]
lopdf = { path = "extensions/ygg-serve/vendor/lopdf" }
