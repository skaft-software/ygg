[package]
name = "ygg-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Stateful agent loop with tool execution and event streaming for Ygg."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ai", "agents", "tools", "sessions", "llm"]
categories = ["development-tools"]

[lints]
workspace = true

[features]
benchmarks = []

[dependencies]
ygg-ai = { version = "=0.6.7", path = "../ygg-ai" }
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = "1"
thiserror = "1"
async-trait = "0.1"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
# Portable advisory file locking with an MSRV below the workspace's 1.86.
fs2 = "0.4"
getrandom = "0.4"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
base64 = "0.22"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

# One `libc::kill(-pgid, SIGKILL)` call terminates a cancelled bash tool's whole
# process group (tokio's kill_on_drop only reaches the direct child).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Threading",
] }

[[example]]
name = "session_bench"
path = "examples/session_bench.rs"
required-features = ["benchmarks"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
wiremock = "=0.6.4"
pretty_assertions = "1"
http = "1"
