# "Kodex" — a quiet monochrome folio with one cyan pen.
# Shaded prompt rectangle, dim secondary text, and the shared Ygg transcript geometry.
[metadata]
name = "Kodex"
description = "A quiet monochrome folio with one cyan pen and a shaded prompt rectangle. Very archival."
author = "Ygg theme pack"
version = "1"
terminal = "light-dark"
adaptive = false

[colors]
accent = "#347f88"
muted = "#6f7a80"
error = "#b25454"
warning = "#9a7b3f"
success = "#43845e"
info = "#5f87a8"
border = "#6c7680"
border_focused = "accent"
tool_title = "foreground"
md_heading = "default"
md_link = "info"
md_code = "default"
md_quote_border = "muted"
md_list_bullet = "muted"
kodex_user_bg = "default"
composer = "shaded"
composer_bg = "kodex_user_bg"

[model]
use_lab_color = false

[roles.tool_title]
foreground = "tool_title"
bold = true

[roles.heading]
foreground = "md_heading"
bold = true

[roles.emphasis]
italic = true

[roles.strong]
bold = true

[roles.link]
foreground = "md_link"
underline = true

[roles.inline_code]
foreground = "md_code"

[roles.quote]
foreground = "muted"
italic = true

[roles.notification]
foreground = "muted"
italic = true

[roles.confirmation]
foreground = "accent"
bold = true

[roles."extension.sparkle"]
foreground = "accent"
italic = true

[roles."extension.status"]
foreground = "muted"
italic = true

[roles."extension.header"]
foreground = "accent"
bold = true

[roles."surface.user"]
foreground = "foreground"
background = "kodex_user_bg"

[roles."surface.user.border"]
foreground = "muted"
bold = true
dim = true

[roles."surface.user.label"]
foreground = "muted"
bold = true

[roles."surface.assistant"]
foreground = "foreground"

[roles."surface.assistant.border"]
foreground = "muted"

[roles."surface.assistant.label"]
foreground = "muted"
bold = true

[roles."surface.reasoning"]
foreground = "muted"
italic = true
dim = true

[roles."surface.reasoning.border"]
foreground = "muted"

[roles."surface.reasoning.label"]
foreground = "muted"
italic = true

[roles."surface.tool"]
foreground = "muted"

[roles."surface.tool.border"]
foreground = "muted"

[roles."surface.tool.label"]
foreground = "foreground"
bold = true

[roles."surface.shell"]
foreground = "muted"

[roles."surface.shell.border"]
foreground = "muted"

[roles."surface.shell.label"]
foreground = "foreground"
bold = true

[roles."surface.notice"]
foreground = "muted"

[roles."surface.notice.border"]
foreground = "muted"

[roles."surface.notice.label"]
foreground = "muted"
bold = true

[roles."surface.outcome"]
foreground = "muted"

[roles."surface.outcome.border"]
foreground = "muted"

[roles."surface.outcome.label"]
foreground = "muted"
bold = true

[roles."surface.compaction"]
foreground = "muted"
italic = true

[roles."surface.compaction.border"]
foreground = "muted"

[roles."surface.compaction.label"]
foreground = "muted"
italic = true

[glyphs]
top_left = "┌"
top_right = "┐"
bottom_left = "└"
bottom_right = "┘"
horizontal = "─"
vertical = "│"
rail = "•"
prompt = "›"
shell = "$"
success = "✓"
warning = "▲"
note = "□"
error = "✗"
interrupt = "■"
pending = "·"
collapsed = "▸"
expanded = "▾"
separator = " · "
ellipsis = "…"
bullet = "•"
reasoning = "…"
wordmark = "kodex"

[glyphs_ascii]
top_left = "+"
top_right = "+"
bottom_left = "+"
bottom_right = "+"
horizontal = "-"
vertical = "|"
rail = "*"
prompt = ">"
shell = "$"
success = "+"
warning = "!"
note = "[]"
error = "x"
interrupt = "#"
pending = "."
collapsed = ">"
expanded = "v"
separator = " - "
ellipsis = "..."
bullet = "*"
reasoning = "..."
wordmark = "kodex"

[layout]
density = "comfortable"
show_header = false
show_footer = true
show_status_line = true
show_reasoning = true
show_panel_borders = true
prompt_padding = true
transcript_inset = 2
composer_padding = 1
narrow_breakpoint = 64
narrow_show_header = false
narrow_show_footer = true
narrow_show_status_line = true
narrow_show_reasoning = true
narrow_show_panel_borders = false

[variants.dark.colors]
accent = "#00cdcd"
muted = "#767676"
error = "#ff6b6b"
warning = "#d0c060"
success = "#5faf5f"
info = "#6ea4c8"
border = "#4d5966"
kodex_user_bg = "#323232"
composer_bg = "#323232"

[variants.light.colors]
accent = "#005f87"
muted = "#6c6c6c"
error = "#b4233a"
warning = "#8a6d1a"
success = "#1e7a3c"
info = "#355f9e"
border = "#4d5966"
kodex_user_bg = "#f4f4f4"
composer_bg = "#f4f4f4"
