# "Clawed" — a warm terracotta bench that reminds you of another agent.
# Rounded frames, record-button tool dots, and bracket result rails.
[metadata]
name = "Clawed"
description = "A warm terracotta workspace with rounded frames, record-button tool dots, and bracket result rails. Suspiciously familiar."
author = "Ygg theme pack"
version = "1"
terminal = "light-dark"
adaptive = false

[colors]
accent = "#b55c39"
muted = "#8b8177"
error = "#b04a45"
warning = "#9a7b3f"
success = "#4f8a68"
info = "#6f8fae"
border = "#8d7d70"
border_focused = "accent"
tool_title = "accent"
md_heading = "default"
md_link = "info"
md_code = "default"
md_quote_border = "muted"
md_list_bullet = "accent"
composer = "framed"
composer_border = "border"

[model]
use_lab_color = false

[roles.tool_title]
foreground = "tool_title"
bold = true

[roles.heading]
foreground = "md_heading"
bold = true

[roles.emphasis]
italic = true

[roles.strong]
bold = true

[roles.link]
foreground = "md_link"
underline = true

[roles.inline_code]
foreground = "md_code"

[roles.quote]
foreground = "muted"
italic = true

[roles.notification]
foreground = "info"
italic = true

[roles.confirmation]
foreground = "accent"
bold = true

[roles."extension.sparkle"]
foreground = "accent"
italic = true

[roles."extension.status"]
foreground = "info"
italic = true

[roles."extension.header"]
foreground = "accent"
bold = true

[roles."surface.user"]
foreground = "foreground"

[roles."surface.user.border"]
foreground = "accent"

[roles."surface.user.label"]
foreground = "accent"
bold = true

[roles."surface.assistant"]
foreground = "foreground"

[roles."surface.assistant.border"]
foreground = "border"

[roles."surface.assistant.label"]
foreground = "accent"
bold = true

[roles."surface.reasoning"]
foreground = "muted"
italic = true

[roles."surface.reasoning.border"]
foreground = "border"

[roles."surface.reasoning.label"]
foreground = "muted"
italic = true

[roles."surface.tool"]
foreground = "foreground"

[roles."surface.tool.border"]
foreground = "accent"

[roles."surface.tool.label"]
foreground = "accent"
bold = true

[roles."surface.shell"]
foreground = "foreground"

[roles."surface.shell.border"]
foreground = "accent"

[roles."surface.shell.label"]
foreground = "accent"
bold = true

[roles."surface.notice"]
foreground = "foreground"

[roles."surface.notice.border"]
foreground = "warning"

[roles."surface.notice.label"]
foreground = "accent"
bold = true

[roles."surface.outcome"]
foreground = "muted"

[roles."surface.outcome.border"]
foreground = "accent"

[roles."surface.outcome.label"]
foreground = "accent"
bold = true

[roles."surface.compaction"]
foreground = "muted"
italic = true

[roles."surface.compaction.border"]
foreground = "border"

[roles."surface.compaction.label"]
foreground = "info"
italic = true

[glyphs]
top_left = "╭"
top_right = "╮"
bottom_left = "╰"
bottom_right = "╯"
horizontal = "─"
vertical = "│"
rail = "⎿"
prompt = ">"
shell = "⏺"
success = "✓"
warning = "⚠"
note = "○"
error = "✗"
interrupt = "■"
pending = "✳"
collapsed = "▸"
expanded = "▾"
separator = " · "
ellipsis = "…"
bullet = "⏺"
reasoning = "✻"
wordmark = "✻ clawed"

[glyphs_ascii]
top_left = "+"
top_right = "+"
bottom_left = "+"
bottom_right = "+"
horizontal = "-"
vertical = "|"
rail = "*"
prompt = ">"
shell = "$"
success = "+"
warning = "!"
note = "o"
error = "x"
interrupt = "#"
pending = "*"
collapsed = ">"
expanded = "v"
separator = " - "
ellipsis = "..."
bullet = "*"
reasoning = "*"
wordmark = "clawed"

[surfaces.user]
chrome = "plain"
heading = "none"
padding = 0
width = "content"
align = "left"
max_width = 96
narrow_chrome = "plain"
narrow_heading = "none"
narrow_padding = 0

[surfaces.assistant]
chrome = "plain"
heading = "none"
padding = 0
width = "content"
align = "left"
max_width = 96
narrow_chrome = "plain"
narrow_heading = "none"
narrow_padding = 0

[surfaces.reasoning]
chrome = "plain"
heading = "none"
padding = 0
width = "content"
align = "left"
max_width = 92
narrow_chrome = "plain"
narrow_heading = "none"
narrow_padding = 0

[surfaces.tool]
chrome = "rail"
heading = "none"
padding = 1
width = "content"
align = "left"
max_width = 96
narrow_chrome = "rail"
narrow_heading = "none"
narrow_padding = 0

[surfaces.shell]
chrome = "rail"
heading = "none"
padding = 1
width = "content"
align = "left"
max_width = 96
narrow_chrome = "rail"
narrow_heading = "none"
narrow_padding = 0

[surfaces.notice]
chrome = "plain"
heading = "none"
padding = 0
width = "content"
align = "left"
max_width = 92
narrow_chrome = "plain"
narrow_heading = "none"
narrow_padding = 0

[surfaces.outcome]
chrome = "rule"
heading = "overline"
label = "done"
padding = 0
width = "content"
align = "left"
max_width = 80
narrow_chrome = "plain"
narrow_heading = "inline"
narrow_label = "done"
narrow_padding = 0

[surfaces.compaction]
chrome = "plain"
heading = "none"
padding = 0
width = "content"
align = "left"
max_width = 92
narrow_chrome = "plain"
narrow_heading = "none"
narrow_padding = 0

[layout]
density = "comfortable"
show_header = false
show_footer = true
show_status_line = true
show_reasoning = true
show_panel_borders = true
transcript_inset = 2
composer_padding = 1
narrow_breakpoint = 64
narrow_show_header = false
narrow_show_footer = true
narrow_show_status_line = true
narrow_show_reasoning = true
narrow_show_panel_borders = false

[variants.dark.colors]
accent = "#d97757"
muted = "#9a938c"
error = "#e06c5f"
warning = "#d9a25f"
success = "#5bad7f"
info = "#7fa8c9"
border = "#6e5f54"
tool_title = "#d97757"
md_link = "#7fa8c9"

[variants.light.colors]
accent = "#a04a26"
muted = "#6e6660"
error = "#a83a30"
warning = "#8a5a12"
success = "#1c6e44"
info = "#33608a"
border = "#a08c7a"
tool_title = "#a04a26"
md_link = "#33608a"
