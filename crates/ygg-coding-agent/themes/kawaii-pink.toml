[metadata]
name = "Kawaii Pink"
description = "A candy-bright pink workspace with blush rails, ribbon markers, tiny hearts, and the default theme's focused spacing."
author = "Ygg theme pack"
version = "1"
terminal = "light-dark"
adaptive = true

[colors]
accent = "#d63f8c"
muted = "#8d667a"
error = "#c63f61"
warning = "#9d651d"
success = "#3f8265"
info = "#7657a8"
border = "#a85d86"
border_focused = "accent"
tool_title = "#b83e82"
md_heading = "accent"
md_link = "#7657a8"
md_code = "#ad4f7b"
md_code_border = "border"
md_quote_border = "#df5b9e"
md_list_bullet = "accent"
syntax_comment = "#8d667a"
syntax_keyword = "#b83e82"
syntax_function = "#7657a8"
syntax_string = "#3f8265"
syntax_number = "#9d651d"
syntax_type = "#9b4c85"
syntax_operator = "#d63f8c"
diff_added_bg = "#3f8265"
diff_removed_bg = "#c63f61"
kawaii_blush_bg = "default"
kawaii_lilac_bg = "default"
kawaii_note_bg = "default"

[model]
use_lab_color = false

[roles.tool_title]
foreground = "tool_title"
bold = true

[roles.heading]
foreground = "md_heading"
bold = true

[roles.emphasis]
foreground = "accent"
italic = true

[roles.strong]
foreground = "accent"
bold = true

[roles.link]
foreground = "md_link"
underline = true

[roles.inline_code]
foreground = "md_code"

[roles.quote]
foreground = "muted"
italic = true

[roles.notification]
foreground = "info"
italic = true

[roles.confirmation]
foreground = "accent"
bold = true

[roles."extension.sparkle"]
foreground = "accent"
italic = true

[roles."extension.status"]
foreground = "info"
italic = true

[roles."extension.header"]
foreground = "accent"
bold = true

[roles."surface.user"]
foreground = "foreground"
background = "kawaii_blush_bg"

[roles."surface.user.border"]
foreground = "accent"

[roles."surface.user.label"]
foreground = "accent"
bold = true

[roles."surface.assistant"]
foreground = "foreground"

[roles."surface.assistant.border"]
foreground = "border"

[roles."surface.assistant.label"]
foreground = "accent"
bold = true

[roles."surface.reasoning"]
foreground = "muted"
italic = true

[roles."surface.reasoning.border"]
foreground = "border"

[roles."surface.reasoning.label"]
foreground = "accent"
italic = true

[roles."surface.tool"]
foreground = "foreground"
background = "kawaii_lilac_bg"

[roles."surface.tool.border"]
foreground = "info"

[roles."surface.tool.label"]
foreground = "info"
bold = true

[roles."surface.shell"]
foreground = "foreground"

[roles."surface.shell.border"]
foreground = "accent"

[roles."surface.shell.label"]
foreground = "accent"
italic = true

[roles."surface.notice"]
foreground = "foreground"
background = "kawaii_note_bg"

[roles."surface.notice.border"]
foreground = "warning"

[roles."surface.notice.label"]
foreground = "accent"
bold = true

[roles."surface.outcome"]
foreground = "muted"

[roles."surface.outcome.border"]
foreground = "accent"

[roles."surface.outcome.label"]
foreground = "accent"
bold = true

[roles."surface.compaction"]
foreground = "muted"
italic = true

[roles."surface.compaction.border"]
foreground = "border"

[roles."surface.compaction.label"]
foreground = "info"
italic = true

[glyphs]
top_left = "╭"
top_right = "╮"
bottom_left = "╰"
bottom_right = "╯"
horizontal = "─"
vertical = "│"
branch = "♡"
last_branch = "╰"
rail = "│"
prompt = "♡"
shell = "⌘"
success = "✓"
warning = "△"
note = "✿"
error = "×"
interrupt = "■"
pending = "·"
collapsed = "▸"
expanded = "▾"
separator = " ·♡· "
ellipsis = "…"
bullet = "♡"
reasoning = "✧"
wordmark = "ygg ♡ kawaii"

[glyphs_ascii]
top_left = "+"
top_right = "+"
bottom_left = "+"
bottom_right = "+"
horizontal = "-"
vertical = "|"
branch = "<3"
last_branch = "`-"
rail = "|"
prompt = ">"
shell = "$"
success = "+"
warning = "!"
note = "*"
error = "x"
interrupt = "#"
pending = "."
collapsed = ">"
expanded = "v"
separator = " <3 "
ellipsis = "..."
bullet = "*"
reasoning = "~"
wordmark = "ygg <3 kawaii"

[surfaces.user]
chrome = "card"
heading = "tab"
label = "YOU ♡"
padding = 1
width = "content"
align = "right"
max_width = 88
narrow_chrome = "rail"
narrow_heading = "inline"
narrow_label = "YOU"
narrow_padding = 0

[surfaces.assistant]
chrome = "plain"
heading = "none"
padding = 0
width = "content"
align = "left"
max_width = 96
narrow_chrome = "plain"
narrow_heading = "none"
narrow_padding = 0

[surfaces.reasoning]
chrome = "rail"
heading = "inline"
label = "THINKING ✧"
padding = 1
width = "content"
align = "left"
max_width = 84
narrow_chrome = "plain"
narrow_heading = "none"
narrow_padding = 0

[surfaces.tool]
chrome = "card"
heading = "tab"
label = "TOOLBOX ✿"
padding = 1
width = "content"
align = "left"
max_width = 96
narrow_chrome = "rail"
narrow_heading = "inline"
narrow_label = "TOOL"
narrow_padding = 0

[surfaces.shell]
chrome = "rail"
heading = "inline"
label = "SHELL ♡"
padding = 1
width = "content"
align = "left"
max_width = 96
narrow_chrome = "rail"
narrow_heading = "none"
narrow_padding = 0

[surfaces.notice]
chrome = "band"
heading = "inline"
label = "NOTE ♡"
padding = 1
width = "content"
align = "center"
max_width = 84
narrow_chrome = "plain"
narrow_heading = "inline"
narrow_label = "NOTE"
narrow_padding = 0

[surfaces.outcome]
chrome = "rule"
heading = "overline"
label = "ALL DONE ♡"
padding = 0
width = "content"
align = "center"
max_width = 72
narrow_chrome = "plain"
narrow_heading = "inline"
narrow_label = "DONE"
narrow_padding = 0

[surfaces.compaction]
chrome = "rail"
heading = "inline"
label = "MEMORY RIBBON"
padding = 1
width = "content"
align = "left"
max_width = 88
narrow_chrome = "plain"
narrow_heading = "inline"
narrow_label = "MEMORY"
narrow_padding = 0

[layout]
density = "comfortable"
show_header = false
show_footer = true
show_status_line = true
show_tool_duration = true
show_reasoning = true
show_panel_borders = true
transcript_inset = 2
composer_padding = 1
narrow_breakpoint = 64
narrow_show_header = false
narrow_show_footer = true
narrow_show_status_line = true
narrow_show_tool_duration = true
narrow_show_reasoning = true
narrow_show_panel_borders = false

[variants.dark.colors]
accent = "#ff75b5"
muted = "#d09ab6"
error = "#ff6f91"
warning = "#eeb866"
success = "#73cdaa"
info = "#c09af2"
border = "#dc8bb5"
tool_title = "#ff92c4"
md_heading = "#ff75b5"
md_link = "#c09af2"
md_code = "#ffacd0"
md_code_border = "#dc8bb5"
md_quote_border = "#ff75b5"
md_list_bullet = "#ff75b5"
kawaii_blush_bg = "#7a1f50"
kawaii_lilac_bg = "#56335f"
kawaii_note_bg = "#713949"

[variants.light.colors]
accent = "#ad1457"
muted = "#765468"
error = "#b3264b"
warning = "#744a08"
success = "#17684d"
info = "#5b378e"
border = "#94486f"
tool_title = "#9e1455"
md_heading = "#ad1457"
md_link = "#5b378e"
md_code = "#8f315f"
md_code_border = "#94486f"
md_quote_border = "#ad1457"
md_list_bullet = "#ad1457"
kawaii_blush_bg = "#f7b4d3"
kawaii_lilac_bg = "#ddc9f3"
kawaii_note_bg = "#ffd5e5"
