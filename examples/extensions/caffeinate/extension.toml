name = "caffeinate"
version = "0.1.0"
api_version = "0.1"
description = "Keep macOS awake while Ygg is processing a prompt"

[entrypoint]
command = "extension.py"

[capabilities]
filesystem = "none"
process = true
network = false

[contributes]
commands = ["caffeinate"]
hooks = ["before_prompt", "after_response"]
ui = ["status"]
notifications = true
